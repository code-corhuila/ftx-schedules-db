# Standalone environment for this repository only: database + migrations.
# The full system (all services) is orchestrated from ftx-infra.
#
#   cp .env.example .env                       (Windows: copy .env.example .env)
#   docker compose up -d --wait schedules-db
#   docker compose run --rm --build schedules-migrate
#   docker compose run --rm schedules-verify
#   docker compose down -v

name: ftx-schedules-db

services:
  schedules-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${SCHEDULES_DB_NAME:?set it in .env (copy .env.example)}
      POSTGRES_USER: ${SCHEDULES_DB_USER:?set it in .env (copy .env.example)}
      POSTGRES_PASSWORD: ${SCHEDULES_DB_PASSWORD:?set it in .env (copy .env.example)}
    ports:
      - "${SCHEDULES_DB_HOST_PORT:?set it in .env (copy .env.example)}:5432"
    volumes:
      - schedules-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  schedules-migrate:
    build: .
    environment:
      FLYWAY_URL: jdbc:postgresql://schedules-db:5432/${SCHEDULES_DB_NAME}
      FLYWAY_USER: ${SCHEDULES_DB_USER}
      FLYWAY_PASSWORD: ${SCHEDULES_DB_PASSWORD}
    depends_on:
      schedules-db:
        condition: service_healthy
    restart: "no"

  schedules-verify:
    image: postgres:15-alpine
    profiles: ["test"]
    environment:
      PGHOST: schedules-db
      PGDATABASE: ${SCHEDULES_DB_NAME}
      PGUSER: ${SCHEDULES_DB_USER}
      PGPASSWORD: ${SCHEDULES_DB_PASSWORD}
    volumes:
      - ./tests:/tests:ro
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/tests/verify.sql"]
    depends_on:
      schedules-migrate:
        condition: service_completed_successfully
    restart: "no"

volumes:
  schedules-db-data:
