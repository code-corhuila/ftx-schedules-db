name: migrations

on:
  pull_request:
    branches: [develop, qa, main]
  push:
    branches: [develop, qa, main]

jobs:
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar variables locales
        run: cp .env.example .env

      - name: Construir imagen de Flyway
        run: docker compose build schedules-migrate

      - name: Migrar y verificar
        run: docker compose run --rm schedules-verify

      - name: Logs del stack
        if: failure()
        run: docker compose logs

      - name: Limpiar
        if: always()
        run: docker compose down -v
